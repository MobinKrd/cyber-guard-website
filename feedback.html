<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyber Guard | فیدباک</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav class="container">
        <div class="logo">
          <img src="logo.jpg" alt="Cyber Guard Logo" />
          <span>CYBER GUARD</span>
        </div>

        <ul id="nav-links">
          <li><a href="index.html">سەرەتا</a></li>
          <li><a href="about.html">دەربارەی ئێمە</a></li>
          <li><a href="services.html">خزمەتگوزارییەکان</a></li>
          <li><a href="payment.html">پارەدان</a></li>
          <li><a href="contact.html">پەیوەندی</a></li>
          <li>
            <a href="feedback.html" style="color: var(--primary)">فیدباک</a>
          </li>
        </ul>

        <div style="display: flex; align-items: center; gap: 15px">
          <div
            class="header-views"
            style="
              display: flex;
              align-items: center;
              gap: 6px;
              color: var(--primary);
              background: rgba(0, 210, 255, 0.1);
              padding: 5px 12px;
              border-radius: 20px;
              border: 1px solid var(--primary);
              font-size: 1rem;
              font-weight: bold;
            "
          >
            <i class="fas fa-eye"></i>
            <span id="view-count" class="ltr-isolate">1555</span>
          </div>
          <div class="menu-toggle" id="mobile-menu">
            <i class="fas fa-bars"></i>
          </div>
        </div>
      </nav>
    </header>

    <section
      class="feedback-section container"
      style="
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding-top: 60px;
        padding-bottom: 60px;
      "
    >
      <div class="feedback-card">
        <div class="feedback-header">
          <i
            class="fas fa-comment-dots"
            style="
              font-size: 2.5rem;
              color: var(--primary);
              margin-bottom: 15px;
            "
          ></i>
          <h2>ناردنی فیدباک</h2>
          <p>بۆچوونەکانت بۆ ئێمە گرنگن، تکایە فیدباکی خۆتمان بۆ بنێرە.</p>
        </div>

        <!-- لێرە من ئایدییەکەم سڕییەوە تەنیا بۆ کاتی ئەکتیڤکردنەکە -->
        <form
          action="https://formsubmit.co/cyberr.guard2026@gmail.com"
          method="POST"
          class="feedback-form"
        >
          <!-- لادانی کاپچا -->
          <input type="hidden" name="_captcha" value="false" />

          <div class="input-group">
            <i class="fas fa-user"></i>
            <input
              type="text"
              name="ناو"
              placeholder="ناوت لێرە بنووسە..."
              required
            />
          </div>

          <div class="input-group">
            <i
              class="fas fa-envelope-open-text"
              style="align-self: flex-start; margin-top: 18px"
            ></i>
            <textarea
              name="فیدباک"
              placeholder="فیدباکەکەت لێرە بنووسە..."
              required
              rows="5"
            ></textarea>
          </div>

          <button type="submit" class="submit-btn" id="submit-btn">
            ناردن <i class="fas fa-paper-plane"></i>
          </button>
        </form>

        <!-- پەیامی سەرکەوتن (لە سەرەتادا شاردراوەتەوە) -->
        <div
          id="successMessage"
          style="
            display: none;
            background: rgba(39, 174, 96, 0.08);
            color: #2ecc71;
            border: 1px dashed #27ae60;
            padding: 20px;
            border-radius: 16px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
          "
        >
          <i
            class="fas fa-check-circle"
            style="font-size: 2.5rem; margin-bottom: 10px; display: block"
          ></i>
          فیدباکەکەت بە سەرکەوتوویی نێردرا! سوپاس بۆ بۆچوونەکەت.
        </div>
      </div>
    </section>

    <footer>
      <p>هەموو مافەکان پارێزراون - Cyber Guard © 2026</p>
      <p style="margin-top: 10px; font-size: 0.85rem; color: #888">
        Developed by
        <a
          href="https://www.instagram.com/mob.tech1"
          target="_blank"
          style="
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
          "
          >Mobin</a
        >
      </p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
